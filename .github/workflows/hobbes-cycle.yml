# Hobbes deterministic patrol: baseline -> findings -> diff, weekly + on demand.
# Pure Python (stdlib) + the SiteOne crawler binary. No LLM. Opens a cycle PR;
# GitHub email is the notification. Writes only to GitHub.
name: Hobbes cycle

on:
  schedule:
    - cron: "0 13 * * 1"        # Mondays 13:00 UTC
  workflow_dispatch:            # the manual button

permissions:
  contents: write
  pull-requests: write

concurrency:                   # one cycle at a time
  group: hobbes-cycle
  cancel-in-progress: false

jobs:
  patrol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install SiteOne crawler
        # The release asset carries the version in its name (…-vX.Y.Z-linux-x64.tar.gz)
        # and unpacks to siteone-crawler/siteone-crawler, so resolve the URL from the
        # API and strip the top dir onto PATH. (glibc x64 — skip the musl/arm assets.)
        run: |
          URL=$(curl -s https://api.github.com/repos/janreges/siteone-crawler/releases/latest \
            | grep -o 'https://[^"]*-linux-x64\.tar\.gz' | grep -v musl | head -1)
          echo "SiteOne asset: $URL"
          curl -fsSL -o /tmp/siteone.tar.gz "$URL"
          mkdir -p "$HOME/siteone"
          tar -xzf /tmp/siteone.tar.gz -C "$HOME/siteone" --strip-components=1
          echo "$HOME/siteone" >> "$GITHUB_PATH"
          "$HOME/siteone/siteone-crawler" --version || true   # --version prints then exits nonzero; the line above confirms it runs

      - name: Run cycle
        env:
          PSI_API_KEY: ${{ secrets.PSI_API_KEY }}
        run: |
          python3 hobbes/cli.py cycle
          DATE=$(python3 hobbes/cli.py today)   # pinned tz — must match the folder cli wrote
          echo "CYCLE_DATE=$DATE" >> "$GITHUB_ENV"
          SUMMARY=$(python3 hobbes/tools/diff.py --run-dir "hobbes/scorecards/$DATE" | tail -1)
          echo "DIFF_SUMMARY=$SUMMARY" >> "$GITHUB_ENV"
          cat "hobbes/scorecards/$DATE/diff.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Open cycle PR
        uses: peter-evans/create-pull-request@v6
        with:
          branch: hobbes-cycle-${{ env.CYCLE_DATE }}
          title: "Baseline ${{ env.CYCLE_DATE }} — ${{ env.DIFF_SUMMARY }}"
          body-path: hobbes/scorecards/${{ env.CYCLE_DATE }}/diff.md
          add-paths: hobbes/scorecards/${{ env.CYCLE_DATE }}/**
