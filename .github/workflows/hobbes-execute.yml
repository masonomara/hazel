# Hobbes agent stages (plan -> execute), Claude Code only, manual trigger only.
# It writes theme-code changes on a branch and opens a PR for review. It writes
# only to GitHub: no Shopify CLI, no publish. Verification + publish are human.
name: Hobbes execute

on:
  workflow_dispatch:
    inputs:
      budget:
        description: "Effort budget for batch selection (blank = use [cycle].effort_budget from hobbes.toml)"
        default: ""

permissions:
  contents: write
  pull-requests: write
  id-token: write        # claude-code-action fetches an OIDC token → exchanges for the Claude GitHub App token

jobs:
  execute:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve effort budget (input override, else hobbes.toml)
        run: |
          EFFORT="${{ inputs.budget }}"
          [ -z "$EFFORT" ] && EFFORT="$(python3 hobbes/cli.py budget)"
          echo "EFFORT=$EFFORT" >> "$GITHUB_ENV"

      - uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ github.token }}        # authenticates the agent's `gh pr create`
        with:
          # Auth via the Claude Code subscription (Pro/Max), NOT a pay-per-token API key.
          # Generate once with `claude setup-token`, store as the CLAUDE_CODE_OAUTH_TOKEN secret.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Automation mode needs an explicit tool allow-list, or every edit/git/gh call is
          # denied (the agent ran 40 turns but committed nothing without this).
          claude_args: |
            --model claude-opus-4-8
            --max-turns 80
            --allowedTools Edit,Read,Write,Glob,Grep,Bash
          prompt: |
            Run the Hobbes plan + execute stages on the latest cycle.
            Read hobbes/scorecards/PLAN-TEMPLATE.md and hobbes/scorecards/EXECUTE-TEMPLATE.md
            and follow them exactly. Effort budget: ${{ env.EFFORT }}.
            Write plan.md and execution.md into the latest hobbes/scorecards/<date>/ folder.
            Make the theme-code changes, then: create a new branch (hobbes-fix-<date>),
            commit, `git push -u origin` it, and run `gh pr create` to open a PR for review.
            Hard rules: write only to GitHub. Do NOT run the Shopify CLI. Do NOT publish.
            Verification (Theme Check, browser) and the live publish are the human's, at review.
