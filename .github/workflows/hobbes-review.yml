# Hobbes review — post-publish verification. When a Hobbes execute PR (or any
# theme PR) is merged to the default branch and the change is live, re-baseline
# the LIVE site, diff it against the pre-publish baseline, and comment the
# before/after on the PR. Deterministic (no LLM). Writes only a PR comment.
#
# TRIGGER ASSUMPTION: merging the PR makes the change live (the default branch is
# connected to the *published* Shopify theme). If publishing is a separate manual
# step, change `on:` to fire after publish instead — otherwise this measures the
# pre-change live site and reports a false "no change".
name: Hobbes review

on:
  pull_request:
    types: [closed]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    # Only merged PRs into the default branch, and not the data-only cycle PRs.
    if: >
      github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == github.event.repository.default_branch &&
      !startsWith(github.event.pull_request.head.ref, 'hobbes-cycle-')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install SiteOne crawler
        run: |
          curl -fsSL -o /tmp/siteone.tar.gz \
            https://github.com/janreges/siteone-crawler/releases/latest/download/siteone-crawler-linux-x64.tar.gz
          sudo tar -xzf /tmp/siteone.tar.gz -C /usr/local/bin siteone-crawler
          siteone-crawler --version

      - name: Wait for the published change to reach the live site
        run: sleep 180   # Shopify sync + CDN propagation; tune per store

      - name: Re-baseline the live site + diff vs the pre-publish baseline
        env:
          PSI_API_KEY: ${{ secrets.PSI_API_KEY }}
        run: |
          PRIOR=$(ls -d hobbes/scorecards/[0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9] 2>/dev/null | sort | tail -1)
          echo "Pre-publish baseline: $PRIOR"
          python3 hobbes/tools/baseline.py --fresh --run-dir post-publish
          python3 hobbes/tools/findings.py --run-dir post-publish
          python3 hobbes/tools/diff.py --run-dir post-publish --prior "$PRIOR" --out /tmp/diff.md

      - name: Comment the before/after on the merged PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "## 🔎 Post-publish review"
            echo
            echo "Re-baselined the **live** site after this PR went live, against the pre-publish baseline."
            echo
            echo "> **Read each row by its latency.** Crawl counts (alt text, headings, meta) and lab a11y/SEO scores reflect the change **now**. **Field / CrUX is a 28-day rolling average** — a just-published change won't move it yet; that lands in a later regular cycle, not in this comment."
            echo
            cat /tmp/diff.md
          } > /tmp/comment.md
          gh pr comment ${{ github.event.pull_request.number }} --body-file /tmp/comment.md
